<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mileage Tracker → Mileage Insights</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="icons/icon-192.png">
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;
  min-height:100dvh;display:grid;place-items:center;margin:0;text-align:center;padding:24px}
a{color:#f59e0b;font-weight:700;text-decoration:none;font-size:1.1rem}
p{color:#888;font-size:.85rem;line-height:1.6;max-width:320px}
</style>
</head>
<body>
<div>
  <h1>🛣️ Retired</h1>
  <p>Mileage Tracker has been replaced by <b>Mileage Insights</b> — dash-photo capture, trip P&amp;L,
     and real revenue per mile. Sending you there…</p>
  <a href="https://bmhsolutions3711.github.io/mileage-insights/">Open Mileage Insights →</a>
</div>
<script>
// Self-clean: unregister this PWA's service worker + caches, then hop over.
(async () => {
  try {
    const regs = await (navigator.serviceWorker?.getRegistrations?.() ?? []);
    await Promise.all(regs.map(r => r.unregister()));
    const keys = await (caches?.keys?.() ?? []);
    await Promise.all(keys.map(k => caches.delete(k)));
  } catch (e) {}
  setTimeout(() => location.replace('https://bmhsolutions3711.github.io/mileage-insights/'), 1200);
})();
</script>
</body>
</html>
