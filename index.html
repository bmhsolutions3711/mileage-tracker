<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mileage Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#0a0a0a;--surface:#161616;--card:#1e1e1e;--border:#2a2a2a;--text:#e0e0e0;--muted:#888;--accent:#f59e0b;--accent2:#10b981;--danger:#ef4444;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
.container{max-width:480px;margin:0 auto;padding:16px}
header{text-align:center;padding:12px 0 8px}
header h1{font-size:1.4rem;font-weight:700;letter-spacing:-.5px}
header p{font-size:.8rem;color:var(--muted);margin-top:2px}

.stats-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--surface);border-radius:var(--radius);padding:10px;text-align:center;border:1px solid var(--border)}
.stat .value{font-size:1.3rem;font-weight:700;color:var(--accent)}
.stat .label{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

.capture-btn{width:100%;padding:18px;border:2px dashed var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-size:1rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0}
.capture-btn:active{background:var(--card);border-color:var(--accent)}
.capture-btn .cam-icon{font-size:1.5rem}
.capture-btn input{display:none}

.scan-result{background:var(--surface);border:1px solid var(--accent);border-radius:var(--radius);padding:16px;margin:12px 0;display:none}
.scan-result.visible{display:block}
.scan-result h3{font-size:.85rem;color:var(--accent);margin-bottom:12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.field input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);font-size:1.1rem;font-weight:600}
.field input:focus{outline:none;border-color:var(--accent)}
.btn-row{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;padding:12px;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer}
.btn-save{background:var(--accent2);color:#000}
.btn-cancel{background:var(--card);color:var(--muted);border:1px solid var(--border)}

.loading{text-align:center;padding:24px;color:var(--muted);display:none}
.loading.visible{display:block}
.spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.history{margin-top:16px}
.history h3{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.entry{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px;position:relative}
.entry .date{font-size:.7rem;color:var(--muted)}
.entry .readings{display:flex;justify-content:space-between;margin-top:6px}
.entry .reading{text-align:center}
.entry .reading .val{font-size:1.1rem;font-weight:700}
.entry .reading .lbl{font-size:.6rem;color:var(--muted);text-transform:uppercase}
.entry .trip-badge{position:absolute;top:10px;right:12px;background:var(--accent);color:#000;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:20px}
.entry .trailer-tag{font-size:.65rem;color:var(--accent);margin-top:4px}
.entry .del-btn{position:absolute;bottom:8px;right:12px;background:none;border:none;color:var(--danger);font-size:.7rem;cursor:pointer;opacity:.4}
.entry .del-btn:hover{opacity:1}

.empty{text-align:center;padding:32px;color:var(--muted);font-size:.85rem}
.setup{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:12px 0}
.setup label{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.setup input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);font-size:.85rem;margin-top:4px}
.setup .save-setup{margin-top:10px;background:var(--accent);color:#000;border:none;border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer;font-size:.8rem}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent2);color:#000;padding:10px 20px;border-radius:20px;font-size:.85rem;font-weight:600;z-index:100;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
.cpm-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin:12px 0}
.cpm-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.cpm-title{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.cpm-hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.cpm-metric{text-align:center;background:var(--card);border-radius:8px;padding:10px}
.cpm-metric .big{font-size:1.5rem;font-weight:700;color:var(--accent2)}
.cpm-metric .big.over{color:var(--danger)}
.cpm-metric .lbl{font-size:.6rem;color:var(--muted);text-transform:uppercase;margin-top:2px}
.cpm-metric .est{font-size:.5rem;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:0 4px;margin-left:4px;vertical-align:middle}
.cpm-floor{margin-top:12px}
.cpm-floor .bar{height:8px;background:var(--card);border-radius:6px;overflow:hidden}
.cpm-floor .fill{height:100%;background:var(--accent2);border-radius:6px;transition:width .3s}
.cpm-floor .fill.over{background:var(--danger)}
.cpm-floor .floor-lbl{display:flex;justify-content:space-between;font-size:.6rem;color:var(--muted);margin-top:4px}
.cpm-detail{display:none;margin-top:12px;border-top:1px solid var(--border);padding-top:12px}
.cpm-detail.open{display:block}
.cpm-period{display:flex;gap:4px}
.cpm-period button{flex:1;background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:5px;font-size:.65rem;cursor:pointer}
.cpm-period button.active{border-color:var(--accent);color:var(--accent)}
.cpm-row{display:flex;justify-content:space-between;font-size:.8rem;padding:3px 0}
.cpm-row .k{color:var(--muted)}
.cpm-row.tot{font-weight:700;border-top:1px solid var(--border);margin-top:4px;padding-top:6px}
.cpm-settings{display:flex;gap:8px;margin-top:12px}
.cpm-settings input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text);font-size:.85rem}
.cpm-note{font-size:.65rem;color:var(--muted);margin-top:10px;line-height:1.45}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Mileage Tracker</h1>
    <p>Snap. Extract. Done.</p>
  </header>

  <div class="stats-bar" id="statsBar">
    <div class="stat"><div class="value" id="statWeek">--</div><div class="label">This Week</div></div>
    <div class="stat"><div class="value" id="statMonth">--</div><div class="label">This Month</div></div>
    <div class="stat"><div class="value" id="statTotal">--</div><div class="label">Total</div></div>
  </div>

  <div class="cpm-card" id="cpmCard">
    <div class="cpm-head" onclick="toggleCpm()">
      <span class="cpm-title">&#128176; Cost / Mile</span>
      <span id="cpmToggle" style="color:var(--muted);font-size:.85rem">&#9662;</span>
    </div>
    <div class="cpm-hero">
      <div class="cpm-metric"><div class="big" id="cpmFuel">--</div><div class="lbl">Fuel $/mi</div></div>
      <div class="cpm-metric"><div class="big" id="cpmOp">--</div><div class="lbl">Operating $/mi</div></div>
    </div>
    <div class="cpm-floor">
      <div class="bar"><div class="fill" id="cpmFill" style="width:0%"></div></div>
      <div class="floor-lbl"><span id="cpmFloorPos">&mdash;</span><span>floor $1.00/mi</span></div>
    </div>
    <div class="cpm-detail" id="cpmDetail">
      <div class="cpm-period">
        <button data-p="all" class="active" onclick="setCpmPeriod('all')">All</button>
        <button data-p="ytd" onclick="setCpmPeriod('ytd')">YTD</button>
        <button data-p="90d" onclick="setCpmPeriod('90d')">90d</button>
        <button data-p="30d" onclick="setCpmPeriod('30d')">30d</button>
      </div>
      <div id="cpmRows" style="margin-top:10px"></div>
      <div class="cpm-settings">
        <input type="number" step="0.01" inputmode="decimal" id="dieselInput" placeholder="Diesel $/gal">
        <input type="number" step="0.1" inputmode="decimal" id="mpgInput" placeholder="MPG">
      </div>
      <div class="cpm-note" id="cpmNote"></div>
    </div>
  </div>

  <label class="capture-btn" id="captureBtn">
    <span class="cam-icon">&#128247;</span>
    <span>Snap Dashboard</span>
    <input type="file" accept="image/*" capture="environment" id="cameraInput">
  </label>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p style="margin-top:8px">Reading your dash...</p>
  </div>

  <div class="scan-result" id="scanResult">
    <h3>Extracted Values</h3>
    <div class="field">
      <label>Odometer (mi)</label>
      <input type="number" step="0.1" id="odometerInput">
    </div>
    <div class="field">
      <label>Trailer Miles</label>
      <input type="number" id="trailerInput">
    </div>
    <div class="field">
      <label>Trailer Name</label>
      <input type="text" id="trailerNameInput">
    </div>
    <div class="field">
      <label>Date</label>
      <input type="datetime-local" id="dateInput">
    </div>
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="cancelScan()">Cancel</button>
      <button class="btn btn-save" onclick="saveEntry()">Save</button>
    </div>
  </div>

  <div class="history" id="history">
    <h3>History</h3>
    <div id="entryList"></div>
  </div>

  <div class="setup" id="setup" style="display:none">
    <label>Backend URL</label>
    <input type="url" id="apiUrl" placeholder="https://your-tailscale-url">
    <br><br>
    <label>Token</label>
    <input type="password" id="apiToken" placeholder="Bearer token">
    <br>
    <button class="save-setup" onclick="saveConfig()">Save</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import exifr from 'https://cdn.jsdelivr.net/npm/exifr@7/dist/full.esm.mjs';

const $ = id => document.getElementById(id);

let API_URL = localStorage.getItem('mt_api') || '';
let API_TOKEN = localStorage.getItem('mt_token') || '';

// ── BIK PWA standard: auto-update + #reset + scan-to-connect ──────────────
// Canonical source: ~/Local Models/bik/pwa-standard/bik-pwa.js
function bikPwa(opts = {}) {
  const { apiKey, tokenKey, onConnect } = opts;
  const hash = location.hash || '';
  if (hash === '#reset' || hash === '#nuke') {
    (async () => {
      try {
        const regs = await (navigator.serviceWorker?.getRegistrations?.() ?? []);
        await Promise.all(regs.map(r => r.unregister()));
        const keys = await (caches?.keys?.() ?? []);
        await Promise.all(keys.map(k => caches.delete(k)));
      } catch (e) {}
      location.replace(location.pathname);
    })();
    return;
  }
  const m = hash.match(/[#&]cfg=([^&]+)/);
  if (m && apiKey && tokenKey) {
    try {
      const cfg = JSON.parse(decodeURIComponent(m[1]));
      if (cfg.api)   localStorage.setItem(apiKey,   cfg.api.replace(/\/$/, ''));
      if (cfg.token) localStorage.setItem(tokenKey, cfg.token);
      history.replaceState(null, '', location.pathname + location.search);
      if (typeof onConnect === 'function') setTimeout(onConnect, 50);
    } catch (e) {}
  }
  if ('serviceWorker' in navigator) {
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').then(reg => {
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') reg.update();
      });
      setInterval(() => reg.update(), 60 * 60 * 1000);
    }).catch(() => {});
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloaded || !hadController) return;
      reloaded = true;
      location.reload();
    });
  }
}

bikPwa({
  apiKey: 'mt_api',
  tokenKey: 'mt_token',
  onConnect: () => {
    API_URL = localStorage.getItem('mt_api') || '';
    API_TOKEN = localStorage.getItem('mt_token') || '';
    $('setup').style.display = 'none';
    toast('Connected via QR');
    loadEntries(); loadStats();
  },
});

// Re-read synchronously in case a #cfg scan just populated storage
API_URL = localStorage.getItem('mt_api') || API_URL;
API_TOKEN = localStorage.getItem('mt_token') || API_TOKEN;
if (!API_URL) $('setup').style.display = 'block';

window.saveConfig = () => {
  API_URL = $('apiUrl').value.replace(/\/$/, '');
  API_TOKEN = $('apiToken').value;
  localStorage.setItem('mt_api', API_URL);
  localStorage.setItem('mt_token', API_TOKEN);
  $('setup').style.display = 'none';
  toast('Connected');
  loadEntries();
  loadStats();
};

function headers() {
  const h = {};
  if (API_TOKEN) h['Authorization'] = `Bearer ${API_TOKEN}`;
  return h;
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function fmtNum(n) {
  if (n == null) return '--';
  return Number(n).toLocaleString('en-US', {maximumFractionDigits: 1});
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
}

// EXIF date extraction
async function getExifDate(file) {
  try {
    const exif = await exifr.parse(file, ['DateTimeOriginal', 'CreateDate']);
    const dt = exif?.DateTimeOriginal || exif?.CreateDate;
    if (dt instanceof Date) return dt;
  } catch {}
  return new Date();
}

function toLocalISO(d) {
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off * 60000);
  return local.toISOString().slice(0, 16);
}

// Camera input handler
$('cameraInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  $('loading').classList.add('visible');
  $('captureBtn').style.display = 'none';

  const capturedDate = await getExifDate(file);

  const form = new FormData();
  form.append('photo', file);

  try {
    const resp = await fetch(`${API_URL}/api/scan`, {method:'POST', headers: headers(), body: form});
    const data = await resp.json();

    if (!resp.ok) {
      toast(data.error || 'Scan failed');
      $('loading').classList.remove('visible');
      $('captureBtn').style.display = 'flex';
      return;
    }

    $('odometerInput').value = data.odometer || '';
    $('trailerInput').value = data.trailer_miles || '';
    $('trailerNameInput').value = data.trailer_name || '';
    $('dateInput').value = toLocalISO(capturedDate);

    $('loading').classList.remove('visible');
    $('scanResult').classList.add('visible');
  } catch (err) {
    toast('Connection failed');
    $('loading').classList.remove('visible');
    $('captureBtn').style.display = 'flex';
  }

  e.target.value = '';
});

window.cancelScan = () => {
  $('scanResult').classList.remove('visible');
  $('captureBtn').style.display = 'flex';
};

window.saveEntry = async () => {
  const body = {
    odometer: parseFloat($('odometerInput').value),
    trailer_miles: $('trailerInput').value ? parseInt($('trailerInput').value) : null,
    trailer_name: $('trailerNameInput').value || null,
    captured_at: new Date($('dateInput').value).toISOString(),
    notes: null,
  };

  if (!body.odometer) { toast('Odometer required'); return; }

  try {
    const resp = await fetch(`${API_URL}/api/entries`, {
      method: 'POST',
      headers: {...headers(), 'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    if (resp.ok) {
      toast('Saved');
      $('scanResult').classList.remove('visible');
      $('captureBtn').style.display = 'flex';
      loadEntries();
      loadStats();
      loadCpm();
    } else {
      const d = await resp.json();
      toast(d.error || 'Save failed');
    }
  } catch { toast('Connection failed'); }
};

async function loadEntries() {
  if (!API_URL) return;
  try {
    const resp = await fetch(`${API_URL}/api/entries?limit=20`, {headers: headers()});
    const data = await resp.json();
    renderEntries(data.entries || []);
  } catch {}
}

function renderEntries(entries) {
  const list = $('entryList');
  if (!entries.length) {
    list.innerHTML = '<div class="empty">No entries yet. Snap your first photo!</div>';
    return;
  }
  list.innerHTML = entries.map(e => `
    <div class="entry">
      <div class="date">${fmtDate(e.captured_at)}</div>
      ${e.trip_miles != null && e.trip_miles > 0 ? `<div class="trip-badge">+${fmtNum(e.trip_miles)} mi</div>` : ''}
      <div class="readings">
        <div class="reading"><div class="val">${fmtNum(e.odometer)}</div><div class="lbl">Odometer</div></div>
        <div class="reading"><div class="val">${e.trailer_miles != null ? fmtNum(e.trailer_miles) : '--'}</div><div class="lbl">Trailer</div></div>
      </div>
      ${e.trailer_name ? `<div class="trailer-tag">${e.trailer_name}</div>` : ''}
      <button class="del-btn" onclick="deleteEntry(${e.id})">delete</button>
    </div>
  `).join('');
}

window.deleteEntry = async (id) => {
  if (!confirm('Delete this entry?')) return;
  try {
    await fetch(`${API_URL}/api/entries/${id}`, {method:'DELETE', headers: headers()});
    toast('Deleted');
    loadEntries();
    loadStats();
  } catch { toast('Failed'); }
};

async function loadStats() {
  if (!API_URL) return;
  try {
    const resp = await fetch(`${API_URL}/api/stats`, {headers: headers()});
    const s = await resp.json();
    $('statWeek').textContent = fmtNum(s.week_miles);
    $('statMonth').textContent = fmtNum(s.month_miles);
    $('statTotal').textContent = fmtNum(s.total_miles);
  } catch {}
}

// ── Cost per mile ──
let cpmPeriod = 'all';
window.toggleCpm = () => {
  const d = $('cpmDetail');
  d.classList.toggle('open');
  $('cpmToggle').textContent = d.classList.contains('open') ? '▴' : '▾';
  if (d.classList.contains('open')) loadCpm();
};
window.setCpmPeriod = (p) => {
  cpmPeriod = p;
  document.querySelectorAll('.cpm-period button').forEach(b => b.classList.toggle('active', b.dataset.p === p));
  loadCpm();
};
function fmtMoney(n){ return n==null?'--':'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtCpm(n){ return n==null?'--':'$'+Number(n).toFixed(2); }
async function loadCpm(){
  if (!API_URL) return;
  const diesel = localStorage.getItem('mt_diesel') || '';
  const mpg = localStorage.getItem('mt_mpg') || '';
  if ($('dieselInput') && document.activeElement !== $('dieselInput')) $('dieselInput').value = diesel;
  if ($('mpgInput') && document.activeElement !== $('mpgInput')) $('mpgInput').value = mpg;
  const qs = new URLSearchParams({period: cpmPeriod});
  if (diesel) qs.set('diesel', diesel);
  if (mpg) qs.set('mpg', mpg);
  try { renderCpm(await (await fetch(`${API_URL}/api/cpm?${qs}`, {headers: headers()})).json()); } catch {}
}
function renderCpm(d){
  const fuelActual = d.fuel_cpm, fuelEst = d.estimate && d.estimate.fuel_cpm_est;
  const fuelEl = $('cpmFuel');
  if (fuelActual != null) fuelEl.innerHTML = fmtCpm(fuelActual);
  else if (fuelEst != null) fuelEl.innerHTML = fmtCpm(fuelEst) + '<span class="est">est</span>';
  else fuelEl.textContent = '--';
  const opEl = $('cpmOp');
  if (d.operating_cpm != null) { opEl.textContent = fmtCpm(d.operating_cpm); opEl.classList.toggle('over', d.operating_cpm > d.floor); }
  else { opEl.innerHTML = '<span style="font-size:.85rem;color:var(--muted)">accruing</span>'; opEl.classList.remove('over'); }
  const ref = d.operating_cpm != null ? d.operating_cpm : (fuelActual != null ? fuelActual : fuelEst);
  const fill = $('cpmFill');
  if (ref != null) {
    fill.style.width = Math.min(ref / d.floor, 1) * 100 + '%';
    fill.classList.toggle('over', ref > d.floor);
    $('cpmFloorPos').textContent = fmtCpm(ref) + '/mi' + (d.operating_cpm == null ? ' fuel est' : '');
  } else { fill.style.width = '0%'; $('cpmFloorPos').textContent = '—'; }
  const c = d.costs || {};
  $('cpmRows').innerHTML =
    [['Fuel',c.fuel],['Maintenance',c.maintenance],['Tolls',c.tolls],['Supplies',c.supplies],['Insurance',c.insurance]]
      .map(function(kv){ return `<div class="cpm-row"><span class="k">${kv[0]}</span><span>${fmtMoney(kv[1])}</span></div>`; }).join('')
    + `<div class="cpm-row tot"><span class="k">Operating</span><span>${fmtMoney(c.operating)}</span></div>`
    + `<div class="cpm-row"><span class="k">+ lodging/food = all-in</span><span>${fmtMoney(c.all_in)}</span></div>`;
  let note = '';
  if (!d.miles_available) note = 'Snap 2+ photos so miles can be measured' + (d.latest_odometer ? ` (odometer ${Number(d.latest_odometer).toLocaleString()} mi).` : '.');
  else if (!d.overlap) note = `Costs (${(d.cost_window||{}).start} → ${(d.cost_window||{}).end}) and miles don't overlap yet — import recent statements to unlock actual CPM.`;
  if (!(d.estimate && d.estimate.fuel_cpm_est)) note += ' Enter diesel $/gal below for an instant fuel-cost estimate.';
  $('cpmNote').textContent = note;
}
['dieselInput','mpgInput'].forEach(function(id){
  const el = $(id); if (!el) return;
  el.addEventListener('change', function(e){
    localStorage.setItem(id === 'dieselInput' ? 'mt_diesel' : 'mt_mpg', e.target.value);
    loadCpm();
  });
});

// Settings toggle — long press header
let pressTimer;
document.querySelector('header').addEventListener('pointerdown', () => {
  pressTimer = setTimeout(() => {
    const s = $('setup');
    s.style.display = s.style.display === 'none' ? 'block' : 'none';
    if (s.style.display === 'block') {
      $('apiUrl').value = API_URL;
      $('apiToken').value = API_TOKEN;
    }
  }, 800);
});
document.querySelector('header').addEventListener('pointerup', () => clearTimeout(pressTimer));
document.querySelector('header').addEventListener('pointerleave', () => clearTimeout(pressTimer));

// Init
loadEntries();
loadStats();
loadCpm();
</script>
</body>
</html>
